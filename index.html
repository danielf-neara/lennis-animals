<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Animals">
<title>Lenni's Animals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff7e8;
    --ink: #3b2f4a;
    --night: #2b2d5c;
    --star: #ffe27a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: "Fredoka", "Chalkboard SE", "Comic Sans MS", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-user-select: none; user-select: none;
  }
  header { text-align: center; padding: 24px 16px 8px; }
  h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.2rem); letter-spacing: .5px; }
  header p { margin: 6px 0 0; font-size: 1.2rem; opacity: .75; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
    padding: 16px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .tile {
    border: none;
    border-radius: 28px;
    padding: 14px 8px 12px;
    font: inherit;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.12);
    transition: transform .12s;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .tile:active { transform: scale(.94); }
  .tile .pic { width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; font-size: 80px; line-height: 1; }
  .tile .pic svg { width: 96px; height: 96px; }
  .tile .name { font-size: 1.35rem; font-weight: 700; }
  .wiggle { animation: wiggle .5s; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-6deg)} 75%{transform:rotate(6deg)} }

  footer { text-align: center; padding: 8px 16px 40px; }
  .small-btn {
    font: inherit; font-size: 1rem; border: 2px solid var(--ink); background: transparent;
    color: var(--ink); border-radius: 999px; padding: 8px 18px; cursor: pointer; opacity: .7;
  }

  /* Pop-up card */
  .overlay {
    position: fixed; inset: 0; background: rgba(30,25,50,.55);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .overlay.open { display: flex; }
  .card {
    background: #fff; border-radius: 32px; width: min(560px, 100%); max-height: 100%;
    overflow: auto; text-align: center; position: relative;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.7); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .card .top { padding: 24px 20px 16px; border-radius: 32px 32px 0 0; }
  .card .big { width: 150px; height: 150px; margin: 0 auto; font-size: 128px; line-height: 150px; }
  .card .big svg { width: 150px; height: 150px; }
  .card h2 { margin: 6px 0 10px; font-size: 2.2rem; }
  .bubble {
    display: inline-block; background: #fff; border-radius: 24px; padding: 10px 22px;
    font-size: 1.9rem; font-weight: 700; box-shadow: 0 4px 0 rgba(0,0,0,.1);
    animation: boing .6s ease-out;
  }
  @keyframes boing { 0%{transform:scale(.3)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }

  .sleep {
    background: var(--night); color: #fff; padding: 20px 22px 24px; border-radius: 0 0 32px 32px;
    position: relative; overflow: hidden;
    opacity: 0; transition: opacity .6s ease-out;
  }
  .sleep.show { opacity: 1; }
  .sleep .q { font-size: 1.5rem; margin: 0 0 8px; }
  .sleep .a {
    display: inline-block; background: var(--star); color: var(--night); font-weight: 700;
    font-size: 1.6rem; border-radius: 999px; padding: 4px 20px; margin-bottom: 12px;
  }
  .sleep .fact { font-size: 1.3rem; line-height: 1.45; margin: 0; }
  .zzz { position: absolute; top: 10px; right: 18px; font-size: 1.6rem; font-weight: 700; color: var(--star); }
  .zzz span { display: inline-block; animation: float 2.4s infinite; opacity: 0; }
  .zzz span:nth-child(2) { animation-delay: .6s; font-size: 1.3em; }
  .zzz span:nth-child(3) { animation-delay: 1.2s; font-size: 1.6em; }
  @keyframes float { 0%{opacity:0; transform:translateY(10px)} 30%{opacity:1} 100%{opacity:0; transform:translateY(-22px)} }
  .moon { position: absolute; top: 12px; left: 18px; font-size: 1.8rem; }

  .card-btns { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; }
  .round {
    width: 52px; height: 52px; border-radius: 50%; border: none; background: rgba(255,255,255,.85);
    font-size: 1.6rem; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.12); color: var(--ink);
  }

  /* Printable book: hidden on screen */
  .book { display: none; }
  @media print {
    @page { size: A4; margin: 18mm; }
    header, .grid, footer, .overlay { display: none !important; }
    body { background: #fff; }
    .book { display: block; }
    .page {
      height: 255mm; page-break-after: always; break-after: page;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .page:last-child { page-break-after: auto; break-after: auto; }
    .page .bp { font-size: 220px; line-height: 1; height: 240px; display: flex; align-items: center; }
    .page .bp svg { width: 240px; height: 240px; }
    .page h2 { font-size: 44pt; margin: 10mm 0 4mm; }
    .page .bs { font-size: 34pt; font-weight: 700; margin-bottom: 12mm; }
    .page .bq { font-size: 20pt; margin: 0 0 3mm; }
    .page .bf { font-size: 18pt; line-height: 1.5; max-width: 140mm; margin: 0; }
    .cover h1 { font-size: 54pt; }
  }
</style>
</head>
<body>

<header>
  <h1>Lenni's Animals</h1>
  <p>Tap an animal to hear it!</p>
</header>

<main class="grid" id="grid"></main>

<footer>
  <button class="small-btn" id="printBtn">🖨️ Print as a book</button>
  <p><a href="credits.html" style="color:inherit;opacity:.5;font-size:.9rem">Sound credits</a></p>
</footer>

<div class="overlay" id="overlay">
  <div class="card" id="card"></div>
</div>

<div class="book" id="book"></div>

<script src="animals.js"></script>
<script src="audio-manifest.js"></script>

const pic = a => a.svg ? SVG[a.svg] : a.emoji;

// ---- Speech ----
const synth = window.speechSynthesis;
let voice = null;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  const en = vs.filter(v => v.lang && v.lang.startsWith("en"));
  const lang = v => v.lang.replace("_", "-");
  // Premium / Enhanced voices sound far more natural. Prefer Australian, then any English.
  const hq = en.filter(v => /premium|enhanced|neural|natural/i.test(v.name));
  voice = hq.find(v => lang(v) === "en-AU") || hq[0] ||
          en.find(v => lang(v) === "en-AU") ||
          en.find(v => lang(v) === "en-GB") || en[0] || null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }

// Device voice: only used when there's no audio file. Natural pitch sounds least fake.
function say(text, { pitch = 1, rate = 0.92 } = {}) {
  return new Promise(done => {
    if (!synth) return done();
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.lang = voice ? voice.lang : "en-AU";
    u.pitch = pitch; u.rate = rate;
    u.onend = done; u.onerror = done;
    synth.speak(u);
    setTimeout(done, 20000); // safety net if the browser never fires onend
  });
}

// ---- Audio files ----
// audio-manifest.js lists which recordings exist: sounds/<id>.mp3 and voice/<id>.mp3
const AUDIO = window.AUDIO || { sounds: [], voice: [] };
const hasSound = new Set(AUDIO.sounds), hasVoice = new Set(AUDIO.voice);
// One reused <audio> element: iPad Safari only lets an element play after a tap has "unlocked" it
const player = new Audio();
player.preload = "auto";
function playFile(src) {
  return new Promise(done => {
    player.onended = done; player.onerror = done;
    player.src = src;
    player.play().catch(done);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));

let playId = 0;
function stopAll() {
  playId++;
  player.pause();
  if (synth) synth.cancel();
}

async function speakAnimal(a) {
  stopAll();
  const me = playId;
  const stillMe = () => me === playId;
  // 1. The animal's sound: real recording, otherwise the device voice says it
  if (hasSound.has(a.id)) await playFile(`sounds/${a.id}.mp3`);
  else if (!a.silent || !hasVoice.has(a.id)) await say(a.say, { pitch: 1 + ((a.pitch ?? 1) - 1) * 0.3, rate: a.rate ?? 0.92 });
  if (!stillMe()) return;
  showSleep();
  await wait(350);
  if (!stillMe()) return;
  // 2. The sleep fact: recorded narrator, otherwise the device voice
  if (hasVoice.has(a.id)) { await playFile(`voice/${a.id}.mp3`); return; }
  if (a.silent && hasSound.has(a.id)) await say(a.say);
  if (!stillMe()) return;
  await say(`Do ${a.plural} sleep? ${a.answer.replace("!", ".")} ${a.fact}`);
}

function showSleep() {
  const s = card.querySelector(".sleep");
  if (s) s.classList.add("show");
}

// ---- Grid ----
const grid = document.getElementById("grid");
ANIMALS.forEach(a => {
  const b = document.createElement("button");
  b.className = "tile";
  b.style.background = a.colour;
  b.setAttribute("aria-label", a.name);
  b.innerHTML = `<div class="pic">${pic(a)}</div><div class="name">${a.name}</div>`;
  b.addEventListener("click", () => {
    b.classList.remove("wiggle"); void b.offsetWidth; b.classList.add("wiggle");
    openCard(a);
  });
  grid.appendChild(b);
});

// ---- Card ----
const overlay = document.getElementById("overlay");
const card = document.getElementById("card");
function openCard(a) {
  card.innerHTML = `
    <div class="top" style="background:${a.colour}">
      <div class="card-btns">
        <button class="round" id="again" aria-label="Play again">🔊</button>
        <button class="round" id="close" aria-label="Close">✕</button>
      </div>
      <div class="big">${pic(a)}</div>
      <h2>${a.name}</h2>
      <div class="bubble">${a.sound}</div>
    </div>
    <div class="sleep">
      <div class="moon">🌙</div>
      <div class="zzz"><span>z</span><span>z</span><span>Z</span></div>
      <p class="q">Do ${a.plural} sleep?</p>
      <div class="a">${a.answer}</div>
      <p class="fact">${a.fact}</p>
    </div>`;
  overlay.classList.add("open");
  card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
  speakAnimal(a);
  setTimeout(showSleep, 6000); // show the sleep part even if audio is slow or blocked
  document.getElementById("again").onclick = e => { e.stopPropagation(); speakAnimal(a); };
  document.getElementById("close").onclick = e => { e.stopPropagation(); closeCard(); };
}
function closeCard() {
  overlay.classList.remove("open");
  stopAll();
}
overlay.addEventListener("click", e => { if (e.target === overlay) closeCard(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeCard(); });

// ---- Printable book ----
const book = document.getElementById("book");
book.innerHTML =
  `<section class="page cover"><div class="bp">📖</div><h1>Lenni's Animals</h1><p class="bq">What do they say? Do they sleep?</p></section>` +
  ANIMALS.map(a => `
    <section class="page">
      <div class="bp">${pic(a)}</div>
      <h2>${a.name}</h2>
      <div class="bs">${a.sound}</div>
      <p class="bq">Do ${a.plural} sleep? <b>${a.answer}</b></p>
      <p class="bf">${a.fact}</p>
    </section>`).join("");
document.getElementById("printBtn").addEventListener("click", () => window.print());
</script>
</body>
</html>
